<script>
/* ============================================================
   MOTEUR DE QUIZ + CONTENU DU COURS
   ============================================================ */

/* ---------- Coloration syntaxique pour SQL ---------- */
function hl(src){
  const kw=/\b(SELECT|FROM|WHERE|GROUP|BY|HAVING|ORDER|LIMIT|OFFSET|FETCH|DISTINCT|AS|AND|OR|NOT|NULL|IS|IN|LIKE|ILIKE|BETWEEN|JOIN|INNER|LEFT|RIGHT|FULL|OUTER|CROSS|NATURAL|ON|USING|UNION|INTERSECT|EXCEPT|ALL|ANY|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|VIEW|INDEX|ALTER|ADD|DROP|TRUNCATE|PRIMARY|KEY|FOREIGN|REFERENCES|DEFAULT|UNIQUE|CHECK|CONSTRAINT|AUTO_INCREMENT|CASE|WHEN|THEN|ELSE|END|WITH|RECURSIVE|OVER|PARTITION|BEGIN|COMMIT|ROLLBACK|SAVEPOINT|TRANSACTION|GRANT|REVOKE|ASC|DESC|EXISTS|CAST|COALESCE|NULLS|FIRST|LAST)\b/gi;
  const fn=/\b(COUNT|SUM|AVG|MIN|MAX|ROUND|ABS|CEIL|FLOOR|ROW_NUMBER|RANK|DENSE_RANK|NTILE|LAG|LEAD|FIRST_VALUE|LAST_VALUE|UPPER|LOWER|TRIM|LENGTH|SUBSTRING|CONCAT|NOW|CURRENT_DATE|EXTRACT|AGE)\b/gi;
  const ty=/\b(INT|INTEGER|BIGINT|SMALLINT|SERIAL|VARCHAR|CHAR|TEXT|BOOLEAN|BOOL|DATE|TIMESTAMP|TIMESTAMPTZ|TIME|INTERVAL|DECIMAL|NUMERIC|FLOAT|REAL|DOUBLE|UUID|JSON|JSONB)\b/gi;
  // échappement HTML
  let s=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // On met de côté commentaires et chaines pour ne PAS les recolorer ensuite
  const store=[];
  const stash=(html)=>{ store.push(html); return '\uE000'+String.fromCharCode(0xE100+store.length-1)+'\uE001'; };
  s=s.replace(/(--[^\n]*)/g,(m)=>stash('<span class=tok-cmt>'+m+'</span>'));           // commentaires --
  s=s.replace(/(\/\*[\s\S]*?\*\/)/g,(m)=>stash('<span class=tok-cmt>'+m+'</span>'));    // commentaires /* */
  s=s.replace(/('(?:[^'\\]|\\.)*')/g,(m)=>stash('<span class=tok-lit>'+m+'</span>'));   // chaines 'texte'
  s=s.replace(/\b(\d[\d_]*(?:\.\d+)?)\b/g,'<span class=tok-num>$1</span>');             // nombres
  s=s.replace(ty,'<span class=tok-ty>$1</span>');
  s=s.replace(fn,'<span class=tok-mac>$1</span>');
  s=s.replace(kw,'<span class=tok-kw>$1</span>');
  // restauration des commentaires/chaines
  s=s.replace(/\uE000([\uE100-\uE1FF])\uE001/g,(m,c)=>store[c.charCodeAt(0)-0xE100]);
  return s;
}
function code(src){return '<pre><code>'+hl(src.replace(/^\n/,'').replace(/\s+$/,''))+'</code></pre>';}

/* Callouts helpers */
const def = (t)=>`<div class="callout why"><div class="h">📘 Définition / Syntaxe</div>${t}</div>`;
const why = (t)=>`<div class="callout py"><div class="h">💡 Pourquoi / Intuition</div>${t}</div>`;
const trap= (t)=>`<div class="callout trap"><div class="h">⚠️ Piège fréquent</div>${t}</div>`;
const perf= (t)=>`<div class="callout err"><div class="h">⚡ Performance</div>${t}</div>`;
const data= (t)=>`<div class="callout data"><div class="h">🤖 Lien Data / IA</div>${t}</div>`;
const hist= (t)=>`<div class="callout hist"><div class="h">📜 Culture & histoire</div>${t}</div>`;

/* ============================================================
   DONNÉES DU COURS
   Types de question :
   - mcq   : choix unique (answer = index)
   - multi : choix multiple (answer = [indices])
   - tf    : vrai/faux (answer = true/false)
   - text  : réponse libre courte, auto-évaluée (model + explain)
   - predict: prédiction de sortie, auto-évaluée
   - code  : écriture/refactoring de code, auto-évaluée
   ============================================================ */
const COURSE = [];
</script>

<!-- Contenu SQL -->
<script>
/* Schéma d'exemple utilisé dans tout le cursus :
   clients(id, nom, ville, pays, date_inscription)
   commandes(id, client_id, montant, statut, date_commande)
   produits(id, nom, categorie, prix) */

/* ================= MODULE 1 — Modèle relationnel & SELECT ================= */
COURSE.push({
  type:'module', navtitle:'1 · SELECT',
  title:'Module 1 — Le modèle relationnel & la requête SELECT',
  sub:'Comprendre les tables, puis extraire des données avec SELECT … FROM.',
  lesson:
    `<h3>Qu’est-ce qu’une base relationnelle ?</h3>
    <p>Une base de données relationnelle organise l’information en <b>tables</b> (relations). Chaque table a des <b>colonnes</b> (attributs, typés) et des <b>lignes</b> (enregistrements). SQL (<i>Structured Query Language</i>) est le langage pour <b>interroger</b> et <b>manipuler</b> ces données.</p>`+
    def(`Le <b>schéma</b> décrit la structure. Pour tout ce cursus, on utilise :
    <ul>
      <li><code>clients(id, nom, ville, pays, date_inscription)</code></li>
      <li><code>commandes(id, client_id, montant, statut, date_commande)</code></li>
      <li><code>produits(id, nom, categorie, prix)</code></li>
    </ul>
    <code>client_id</code> dans <code>commandes</code> est une <b>clé étrangère</b> qui référence <code>clients.id</code>.`)+
    `<h3>La requête de base</h3>`+
    code(`-- Sélectionner certaines colonnes de toutes les lignes
SELECT nom, ville
FROM clients;

-- Toutes les colonnes
SELECT *
FROM clients;`)+
    `<p>L’étoile <code>*</code> renvoie toutes les colonnes. <code>SELECT</code> choisit les colonnes (la « projection »), <code>FROM</code> indique la table.</p>`+
    why(`SQL est <b>déclaratif</b> : tu décris <b>ce que</b> tu veux, pas <b>comment</b> l’obtenir. C’est le moteur (l’optimiseur de requêtes) qui décide de la stratégie d’exécution. C’est très différent d’un langage impératif comme Python où tu écris la boucle toi-même. Tu raisonnes en « ensembles de lignes », pas en itérations.`)+
    `<h3>Calculs et littéraux dans le SELECT</h3>`+
    code(`SELECT
    nom,
    prix,
    prix * 1.20 AS prix_ttc      -- colonne calculée, renommée avec AS
FROM produits;`)+
    `<p><code>AS</code> donne un <b>alias</b> (un nom d’affichage) à une colonne ou une expression. On peut faire de l’arithmétique, de la concaténation, etc.</p>`+
    perf(`<code>SELECT *</code> est pratique pour explorer, mais <b>à éviter en production</b> : il transfère des colonnes inutiles (réseau, mémoire) et casse si le schéma change. Nomme explicitement les colonnes dont tu as besoin.`)+
    trap(`SQL <b>ignore la casse</b> des mots-clés (<code>select</code> = <code>SELECT</code>), mais par convention on écrit les mots-clés en MAJUSCULES. En revanche, selon le SGBD, les <b>noms de tables/colonnes</b> peuvent être sensibles à la casse (surtout entre guillemets doubles en PostgreSQL). Le <b>point-virgule</b> <code>;</code> termine une requête.`)+
    data(`SQL est l’outil n°1 du data analyst et du data engineer : avant tout modèle d’IA, il faut <b>extraire, nettoyer et agréger</b> les données — souvent directement en SQL (ou en Spark SQL / BigQuery sur de gros volumes). Savoir écrire un bon <code>SELECT</code> est un prérequis quotidien en IABD.`)+
    hist(`SQL découle du modèle relationnel inventé par <b>Edgar F. Codd</b> (IBM, 1970). Le langage, d’abord nommé SEQUEL, est devenu un standard ISO en 1987. Il reste, 50 ans plus tard, omniprésent. Voir <a href="https://fr.wikipedia.org/wiki/Structured_Query_Language" target="_blank" rel="noopener">SQL — Wikipédia</a>.`),
  quiz:[
    { kind:'mcq', difficulty:1, tags:['SELECT'],
      prompt:`Quelle clause indique la table dans laquelle on lit les données ?`,
      choices:[`<code>SELECT</code>`,`<code>FROM</code>`,`<code>WHERE</code>`,`<code>TABLE</code>`],
      answer:1,
      explain:`<code>FROM</code> désigne la (ou les) table(s) source. <code>SELECT</code> choisit les colonnes à renvoyer (la projection). <code>WHERE</code> (Module 2) filtre les lignes.`},
    { kind:'mcq', difficulty:1, tags:['alias'],
      prompt:`Que fait <code>AS</code> dans <code>SELECT prix * 1.2 AS prix_ttc</code> ?`,
      choices:[`Convertit le type`,`Donne un alias (nom d’affichage) à la colonne calculée`,`Arrondit le résultat`,`Filtre les lignes`],
      answer:1,
      explain:`<code>AS</code> renomme une colonne ou une expression pour l’affichage. Sans lui, la colonne calculée aurait un nom généré peu lisible. L’alias est purement cosmétique (il n’altère pas la table).`},
    { kind:'tf', difficulty:2, tags:['SELECT *','performance'],
      prompt:`En production, il est recommandé d’utiliser <code>SELECT *</code> partout pour ne rien oublier.`,
      answer:false,
      explain:`Faux. <code>SELECT *</code> transfère des colonnes inutiles, pénalise les performances et rend le code fragile aux changements de schéma. On nomme explicitement les colonnes nécessaires.`},
    { kind:'code', difficulty:2, tags:['SELECT'],
      prompt:`Écris une requête qui renvoie le <code>nom</code> et le <code>pays</code> de tous les clients.`,
      starter:`SELECT \nFROM clients;`,
      hint:`Deux colonnes séparées par une virgule, puis FROM.`,
      keywords:['select','nom','pays','from','clients'],
      modelCode:true,
      model:`SELECT nom, pays
FROM clients;`,
      explain:`On projette deux colonnes (<code>nom</code>, <code>pays</code>) depuis la table <code>clients</code>. L’ordre des colonnes dans le résultat suit l’ordre du SELECT.`},
    { kind:'text', difficulty:2, tags:['déclaratif'],
      prompt:`En quoi SQL est-il un langage « déclaratif » ? Oppose-le brièvement à une approche impérative (ex. une boucle Python).`,
      hint:`Décrire le "quoi" vs le "comment".`,
      keywords:['déclaratif','quoi','comment','optimiseur','ensemble','moteur'],
      model:`En SQL on décrit <b>ce que</b> l’on veut obtenir (quelles lignes/colonnes), et le moteur (l’optimiseur) décide <b>comment</b> l’exécuter. En Python impératif, on écrit explicitement <b>comment</b> parcourir et filtrer les données (boucles, conditions).`,
      explain:`Le caractère déclaratif permet au SGBD d’optimiser (choix d’index, ordre des jointures…) sans que tu le spécifies. Tu raisonnes en ensembles de lignes plutôt qu’en itérations pas-à-pas.`}
  ]
});

/* ================= MODULE 2 — WHERE, opérateurs & NULL ================= */
COURSE.push({
  type:'module', navtitle:'2 · WHERE & NULL',
  title:'Module 2 — Filtrer les lignes : WHERE, opérateurs & NULL',

/* ================= MODULE 4 — Agrégation & GROUP BY ================= */

    def(`Règle d’or : toute colonne du <code>SELECT</code> qui n’est <b>pas</b> dans une fonction d’agrégation <b>doit</b> figurer dans le <code>GROUP BY</code>. Sinon, la valeur serait ambiguë (laquelle du groupe ?).`)+
    `<h3>HAVING : filtrer les groupes</h3>

  type:'module', navtitle:'5 · Jointures ★',
  title:'Module 5 — Les jointures (JOIN) ★',
  sub:'Combiner plusieurs tables : le cœur du modèle relationnel.',
  lesson:
    `<p>Les données sont réparties en tables reliées par des clés (normalisation). Les <b>jointures</b> les recombinent. On relie <code>commandes.client_id</code> à <code>clients.id</code>.</p>
    <h3>INNER JOIN — l’intersection</h3>`+
    code(`SELECT c.nom, co.montant
FROM clients AS c
INNER JOIN commandes AS co
    ON co.client_id = c.id;`)+
    def(`<code>INNER JOIN … ON condition</code> ne garde que les lignes où la condition de jonction est vérifiée <b>des deux côtés</b>. Un client sans commande n’apparaît pas ; une commande sans client valide non plus. Les <b>alias de table</b> (<code>c</code>, <code>co</code>) évitent les ambiguïtés et allègent l’écriture.`)+
    `<h3>LEFT JOIN — tout la table de gauche</h3>`+
    code(`-- Tous les clients, AVEC ou SANS commande
SELECT c.nom, co.montant
FROM clients AS c
LEFT JOIN commandes AS co
    ON co.client_id = c.id;`)+
    why(`Le <code>LEFT JOIN</code> conserve <b>toutes</b> les lignes de gauche ; les colonnes de droite valent <code>NULL</code> quand il n’y a pas de correspondance. C’est l’outil pour répondre à « qui n’a <b>rien</b> ? » : on fait un <code>LEFT JOIN</code> puis on filtre <code>WHERE co.id IS NULL</code> (les clients sans commande).`)+
    `<h3>Les types de jointures</h3>
    <table>
      <tr><th>Jointure</th><th>Lignes conservées</th></tr>
      <tr><td><code>INNER JOIN</code></td><td>uniquement les correspondances des deux côtés</td></tr>
      <tr><td><code>LEFT JOIN</code></td><td>toutes celles de gauche (+ correspondances)</td></tr>
      <tr><td><code>RIGHT JOIN</code></td><td>toutes celles de droite (+ correspondances)</td></tr>

/* ================= MODULE 7 — Fonctions de fenêtrage ================= */
COURSE.push({
  type:'module', navtitle:'7 · Window functions ★',
  title:'Module 7 — Fonctions de fenêtrage (window functions) ★',
  sub:'Agréger sans regrouper : classements, cumuls et comparaisons ligne à ligne.',
  lesson:
    `<p>Les <b>fonctions de fenêtrage</b> calculent une valeur agrégée <b>tout en conservant chaque ligne</b> (contrairement à <code>GROUP BY</code> qui réduit les lignes). C’est l’outil intermédiaire/avancé le plus utile en analyse.</p>
    <h3>La clause OVER</h3>`+
    code(`SELECT
    nom,
    montant,
    AVG(montant) OVER () AS moyenne_globale,     -- même valeur sur chaque ligne
    montant - AVG(montant) OVER () AS ecart
FROM commandes;`)+
    def(`<code>fonction() OVER (PARTITION BY … ORDER BY …)</code> définit une « fenêtre » de lignes pour le calcul. <code>PARTITION BY</code> découpe en groupes (comme GROUP BY mais sans fusionner les lignes) ; <code>ORDER BY</code> ordonne à l’intérieur de la fenêtre (utile pour les cumuls et classements).`)+
    `<h3>Classements : ROW_NUMBER, RANK, DENSE_RANK</h3>`+
    code(`-- Classer les commandes par montant décroissant, par client
SELECT
    client_id,
    montant,
    ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY montant DESC) AS rang
FROM commandes;`)+
    `<table>
      <tr><th>Fonction</th><th>Comportement en cas d’égalité</th></tr>
      <tr><td><code>ROW_NUMBER()</code></td><td>numéro unique (1,2,3,4) — départage arbitrairement</td></tr>
      <tr><td><code>RANK()</code></td><td>même rang, puis saute (1,1,3)</td></tr>
      <tr><td><code>DENSE_RANK()</code></td><td>même rang, sans saut (1,1,2)</td></tr>
    </table>`+
    why(`Le patron « <b>top-N par groupe</b> » (ex. les 3 plus grosses commandes <b>de chaque</b> client) est très pénible avec <code>GROUP BY</code> seul, mais trivial avec <code>ROW_NUMBER() OVER (PARTITION BY … ORDER BY …)</code> : on numérote dans chaque partition, puis on filtre <code>rang &lt;= 3</code> (dans une sous-requête/CTE, car on ne peut pas filtrer une window function dans le WHERE directement).`)+
    `<h3>Cumuls et comparaisons temporelles</h3>`+
    code(`-- Total cumulé des montants dans le temps
SELECT
    date_commande,
    montant,
    SUM(montant) OVER (ORDER BY date_commande) AS cumul,
    LAG(montant) OVER (ORDER BY date_commande) AS montant_precedent
FROM commandes;`)+
    trap(`On ne peut <b>pas</b> utiliser une fonction de fenêtrage dans le <code>WHERE</code> ou le <code>HAVING</code> (elles sont évaluées <b>après</b>, au niveau du SELECT). Pour filtrer sur un rang/cumul, encapsule la requête dans une sous-requête ou une <b>CTE</b>, puis filtre à l’extérieur. Autre confusion fréquente : <code>GROUP BY</code> réduit les lignes, <code>OVER()</code> les conserve.`)+
    perf(`Les window functions sont généralement plus efficaces et lisibles que des sous-requêtes corrélées équivalentes (qui recalculent pour chaque ligne). Un index sur les colonnes de <code>PARTITION BY</code>/<code>ORDER BY</code> aide le moteur à éviter des tris coûteux.`)+
    data(`Omniprésentes en analyse : classements (top produits par région), <b>moyennes mobiles</b> et cumuls (séries temporelles), calcul de deltas entre lignes (<code>LAG</code>/<code>LEAD</code> pour des taux de croissance), déduplication (garder la ligne la plus récente par clé via <code>ROW_NUMBER</code>). Un must pour le feature engineering temporel.`),
  quiz:[
    { kind:'mcq', difficulty:2, tags:['OVER','GROUP BY'],
      prompt:`Quelle est la différence clé entre <code>AVG(x) OVER ()</code> et <code>AVG(x)</code> avec <code>GROUP BY</code> ?`,
      choices:[
        `aucune`,
        `<code>OVER()</code> conserve chaque ligne, <code>GROUP BY</code> fusionne les lignes en une par groupe`,
        `<code>OVER()</code> est plus lent et donne un autre résultat`,
        `<code>GROUP BY</code> ne marche pas avec AVG`],
      answer:1,
      explain:`La window function calcule l’agrégat <b>sans réduire</b> le nombre de lignes : chaque ligne reçoit la valeur. <code>GROUP BY</code> renvoie une seule ligne par groupe.`},
    { kind:'mcq', difficulty:3, tags:['RANK','DENSE_RANK'],
      prompt:`Montants triés : 100, 100, 90. Avec <code>RANK()</code>, quels rangs obtient-on ?`,
      choices:[`1, 2, 3`,`1, 1, 2`,`1, 1, 3`,`1, 1, 1`],
      answer:2,
      explain:`<code>RANK()</code> donne le même rang aux ex æquo puis <b>saute</b> : 1, 1, 3. <code>DENSE_RANK()</code> donnerait 1, 1, 2 (sans saut) ; <code>ROW_NUMBER()</code> donnerait 1, 2, 3.`},
    { kind:'tf', difficulty:3, tags:['WHERE','window'],
      prompt:`On peut filtrer directement <code>WHERE ROW_NUMBER() OVER (…) &lt;= 3</code>.`,
      answer:false,
      explain:`Faux. Les window functions sont évaluées au niveau du <code>SELECT</code>, après le <code>WHERE</code>. Il faut les calculer dans une sous-requête/CTE puis filtrer le rang à l’extérieur.`},
    { kind:'mcq', difficulty:2, tags:['LAG'],
      prompt:`À quoi sert <code>LAG(montant) OVER (ORDER BY date_commande)</code> ?`,
      choices:[

        `à trier les montants`],
      answer:1,
      explain:`<code>LAG</code> renvoie la valeur de la ligne <b>précédente</b> dans la fenêtre ordonnée — idéal pour calculer une variation (delta, taux de croissance) d’une période à l’autre. <code>LEAD</code> fait l’inverse (ligne suivante).`},
    { kind:'code', difficulty:3, tags:['top-N par groupe','ROW_NUMBER'],
      prompt:`Écris une requête donnant, pour chaque <code>client_id</code>, sa <b>plus grosse</b> commande (montant max) via <code>ROW_NUMBER()</code> et une sous-requête.`,
      starter:`SELECT client_id, montant\nFROM (\n    \n) AS t\nWHERE rang = 1;`,
      hint:`Numérote par PARTITION BY client_id ORDER BY montant DESC, puis garde rang = 1.`,
      keywords:['row_number','partition by','client_id','order by','montant','desc','rang'],
      modelCode:true,
      model:`SELECT client_id, montant
FROM (

      explain:`On numérote les commandes de chaque client par montant décroissant (<code>PARTITION BY client_id</code>), puis on garde le rang 1 (le max). Le filtrage du rang se fait à l’extérieur, car on ne peut pas filtrer une window function dans le WHERE interne.`}
  ]
});

    `<h3>Index : la clé de la performance</h3>`+
    def(`Un <b>index</b> est une structure de données auxiliaire (souvent un arbre B-tree) qui accélère la <b>recherche</b> et le <b>tri</b> sur une ou plusieurs colonnes — comme l’index d’un livre évite de lire toutes les pages. Sans index, le moteur fait un <b>parcours complet</b> (full scan).`)+

    data(`Comprendre les index, c’est pouvoir faire tenir une requête analytique en secondes plutôt qu’en minutes sur de gros volumes — crucial quand on alimente un pipeline ML. Les transactions garantissent la cohérence des données d’entraînement et des logs. En Big Data (entrepôts colonnes), les principes diffèrent, mais l’idée « éviter de tout lire » reste centrale.`)+
    hist(`Les propriétés <b>ACID</b> ont été formalisées par <b>Jim Gray</b> (fin des années 1970, prix Turing 1998), fondateur de la théorie des transactions. Voir <a href="https://fr.wikipedia.org/wiki/ACID_(informatique)" target="_blank" rel="noopener">ACID — Wikipédia</a>.`),
  quiz:[

    { kind:'mcq', difficulty:3, tags:['index','SARGability'],

      explain:`L’index porte sur <code>date_commande</code>, pas sur <code>YEAR(date_commande)</code>. Envelopper la colonne dans une fonction rend la condition « non-SARGable » ⇒ full scan. Réécris en intervalle de dates pour exploiter l’index.`},
    { kind:'code', difficulty:2, tags:['UPDATE'],
      prompt:`Écris une requête qui passe le <code>statut</code> à <code>'remboursee'</code> pour la commande d’<code>id</code> 17 uniquement.`,
      starter:`UPDATE commandes\nSET \nWHERE ;`,
      hint:`SET statut = 'remboursee', WHERE id = 17.`,
      keywords:['update','set','statut','remboursee','where','id','17'],
      modelCode:true,
      model:`UPDATE commandes
SET statut = 'remboursee'
WHERE id = 17;`,
      explain:`<code>SET</code> définit la nouvelle valeur, <code>WHERE id = 17</code> cible précisément une ligne. Sans ce WHERE, toute la table passerait à « remboursee ».`}
  ]
});

/* ================= CHECKPOINT 2 — Multi-tables & avancé ================= */
COURSE.push({
  type:'checkpoint', navtitle:'⚑ Checkpoint : Jointures & +',
  title:'Checkpoint — Jointures, sous-requêtes, fenêtrage & DML',
  sub:'Synthèse des modules 5 à 8.',
  lesson:`<div class="callout why"><div class="h">🎯 Ce que tu dois maîtriser</div>
    Choisir la bonne jointure (INNER vs LEFT, anti-join), écrire des sous-requêtes (IN/EXISTS, et le piège <code>NOT IN</code> + NULL), utiliser les fonctions de fenêtrage (classements, cumuls, top-N par groupe), et modifier les données en sécurité (WHERE obligatoire, transactions, rôle des index).</div>`,
  exam:[
    { kind:'mcq', difficulty:2, tags:['LEFT JOIN'],
      prompt:`Quelle jointure garde <b>tous</b> les clients, même ceux sans commande ?`,
      choices:[`<code>INNER JOIN</code>`,`<code>LEFT JOIN</code> (clients à gauche)`,`<code>CROSS JOIN</code>`,`aucune`],
      answer:1,
      explain:`<code>LEFT JOIN</code> conserve toutes les lignes de la table de gauche (<code>clients</code>) ; les colonnes de <code>commandes</code> sont NULL s’il n’y a pas de commande.`},
    { kind:'predict', difficulty:2, tags:['CROSS JOIN'], expect:'20',
      prompt:`<code>produits</code> a 5 lignes, <code>mois</code> a 4 lignes. Combien de lignes renvoie <code>produits CROSS JOIN mois</code> ?`,

    { kind:'mcq', difficulty:3, tags:['NOT EXISTS'],
      prompt:`Pour lister les produits <b>jamais</b> commandés de façon robuste aux NULL, on préfère :`,

      answer:1,
      explain:`<code>NOT EXISTS</code> évite le piège de <code>NOT IN</code> avec des NULL (qui renverrait un résultat vide). Il exprime clairement « il n’existe aucune commande pour ce produit ».`},
    { kind:'mcq', difficulty:3, tags:['window','top-N'],
      prompt:`Quel outil est le plus adapté pour « les 3 commandes les plus chères <b>de chaque</b> client » ?`,
      choices:[
        `<code>GROUP BY client_id</code> seul`,
        `<code>ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY montant DESC)</code> puis filtrer rang ≤ 3`,
        `<code>DISTINCT</code>`,
        `<code>CROSS JOIN</code>`],
      answer:1,
      explain:`Le top-N par groupe est le cas d’école des window functions : on numérote dans chaque partition (client), puis on garde les rangs ≤ 3 dans une sous-requête/CTE.`},
    { kind:'tf', difficulty:2, tags:['transactions'],
      prompt:`Dans une transaction, si une opération échoue, <code>ROLLBACK</code> permet de revenir à l’état initial (atomicité).`,
      answer:true,
      explain:`Vrai. C’est l’atomicité (le A de ACID) : la transaction est « tout ou rien ». <code>ROLLBACK</code> annule toutes les modifications depuis le <code>BEGIN</code>.`},
    { kind:'code', difficulty:3, tags:['JOIN','GROUP BY','ORDER BY'],
      prompt:`Écris une requête donnant le nom des 5 clients ayant le plus gros chiffre d’affaires (somme des montants de leurs commandes « payee »). Jointure + agrégation + tri + limite.`,

      hint:`JOIN commandes, WHERE statut='payee', GROUP BY c.id,c.nom, ORDER BY ca DESC, LIMIT 5.`,
      keywords:['join','commandes','where','payee','group by','sum','order by','desc','limit','5'],
      modelCode:true,
      model:`SELECT c.nom, SUM(co.montant) AS ca
FROM clients AS c
JOIN commandes AS co ON co.client_id = c.id
WHERE co.statut = 'payee'
GROUP BY c.id, c.nom
ORDER BY ca DESC
LIMIT 5;`,
      explain:`On joint clients et commandes, on filtre les lignes « payee » (<code>WHERE</code>, avant agrégation), on somme par client, puis on classe par CA décroissant et on garde le top-5. Enchaînement complet des compétences du cursus.`}
  ]
});

COURSE.push({

      answer:1,

    { kind:'predict', difficulty:2, tags:['COUNT'], expect:'4',
      prompt:`Colonne <code>email</code> : 6 lignes dont 2 NULL. Que renvoie <code>COUNT(email)</code> ?`,

    { kind:'mcq', difficulty:2, tags:['GROUP BY'],

    { kind:'mcq', difficulty:2, tags:['JOIN'],

      choices:[`toutes les lignes`,`aucune ligne`,`le produit cartésien`,`une erreur`],
      answer:1,
      explain:`<code>INNER JOIN</code> ne garde que les correspondances ; si aucune ne matche, le résultat est vide.`},
    { kind:'predict', difficulty:2, tags:['CROSS JOIN'], expect:'15',
      prompt:`Table A : 3 lignes, table B : 5 lignes. Combien de lignes pour <code>A CROSS JOIN B</code> ?`,

    { kind:'tf', difficulty:3, tags:['NOT IN','NULL'],
      prompt:`<code>x NOT IN (SELECT y …)</code> est totalement sûr même si <code>y</code> contient des NULL.`,
      answer:false,
      explain:`Faux. Un NULL dans la liste rend <code>NOT IN</code> « inconnu » pour toutes les lignes ⇒ résultat vide. Préfère <code>NOT EXISTS</code>.`},
    { kind:'mcq', difficulty:3, tags:['window'],
      prompt:`<code>ROW_NUMBER() OVER (PARTITION BY client_id ORDER BY date_commande DESC)</code> sert typiquement à :`,
      choices:[
        `compter les clients`,
        `garder la commande la plus récente par client (rang = 1)`,
        `sommer les montants`,
        `trier globalement`],
      answer:1,
      explain:`En numérotant par client selon la date décroissante, le rang 1 est la ligne la plus récente de chaque client — patron de déduplication / « dernier enregistrement par clé ».`},
    { kind:'mcq', difficulty:2, tags:['WHERE vs HAVING'],
      prompt:`Une condition portant sur <code>SUM(montant)</code> doit aller dans :`,
      choices:[`<code>WHERE</code>`,`<code>HAVING</code>`,`<code>ORDER BY</code>`,`<code>FROM</code>`],
      answer:1,
      explain:`Les conditions sur des agrégats vont dans <code>HAVING</code> (après le GROUP BY). <code>WHERE</code> ne peut pas référencer d’agrégat.`},

      answer:true,

    { kind:'mcq', difficulty:3, tags:['index'],
      prompt:`Sur quelle colonne un index est-il le plus utile en priorité ?`,
      choices:[
        `une colonne jamais utilisée en filtre`,
        `une clé étrangère souvent utilisée dans les JOIN et WHERE`,
        `une colonne booléenne à 2 valeurs peu discriminante`,
        `toutes les colonnes systématiquement`],
      answer:1,

    { kind:'code', difficulty:2, tags:['WHERE','ORDER BY'],
      prompt:`Écris une requête : les commandes de statut <code>'payee'</code>, affichant <code>id</code> et <code>montant</code>, triées par montant décroissant.`,

      hint:`WHERE statut = 'payee' puis ORDER BY montant DESC.`,
      keywords:['where','statut','payee','order by','montant','desc'],
      modelCode:true,
      model:`SELECT id, montant
FROM commandes
WHERE statut = 'payee'
ORDER BY montant DESC;`,
      explain:`Filtrage par <code>WHERE</code> sur le statut, puis tri décroissant sur le montant.`},
    { kind:'code', difficulty:3, tags:['JOIN','agrégation'],
      prompt:`Écris une requête donnant, par <code>categorie</code> de produit, le montant total vendu. On suppose une table <code>ventes(produit_id, quantite)</code> et <code>produits(id, categorie, prix)</code>. (total = somme de quantite × prix.)`,
      starter:`SELECT p.categorie, SUM(v.quantite * p.prix) AS total\nFROM ventes AS v\n`,

      keywords:['join','produits','on','produit_id','group by','categorie','sum','quantite','prix'],
      modelCode:true,
      model:`SELECT p.categorie, SUM(v.quantite * p.prix) AS total
FROM ventes AS v
JOIN produits AS p ON p.id = v.produit_id
GROUP BY p.categorie
ORDER BY total DESC;`,
      explain:`On joint ventes et produits pour accéder au prix et à la catégorie, on calcule le chiffre d’affaires ligne par ligne (<code>quantite * prix</code>), puis on agrège par catégorie et on classe. C’est une requête analytique typique.`},
    { kind:'text', difficulty:3, tags:['synthèse','Data/IA'],
      prompt:`Pourquoi SQL est-il incontournable dans un pipeline de data science / IA ? Cite deux étapes concrètes où il intervient.`,
      hint:`Extraction, nettoyage, agrégation, feature engineering.`,
      keywords:['extraction','nettoyage','agrégation','features','jointure','group by','préparation'],
      model:`SQL sert à <b>extraire</b> et <b>préparer</b> les données avant toute modélisation : sélection/filtrage d’un périmètre, nettoyage (gestion des NULL, déduplication), <b>agrégation</b> de features (ex. CA par client via GROUP BY) et <b>jointures</b> pour consolider plusieurs sources en une table d’analyse.`,
      explain:`La majeure partie du temps d’un projet ML est consacrée à la préparation des données, souvent en SQL (ou Spark SQL/BigQuery à grande échelle). Maîtriser SELECT/JOIN/GROUP BY/fenêtrage, c’est pouvoir construire soi-même son dataset d’entraînement.`},

      prompt:`L’ordre d’évaluation logique est : FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT.`,
      answer:true,
      explain:`Vrai. Cet ordre explique pourquoi le WHERE ne voit pas les alias du SELECT, pourquoi HAVING peut filtrer des agrégats, et pourquoi l’ORDER BY peut utiliser les alias.`}

<script>
/* ============================================================
   MOTEUR : rendu, navigation, scoring, adaptativité
   ============================================================ */
const LS_KEY = "sql_cursus_v1";
let state = load();

function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || fresh(); }
  catch(e){ return fresh(); }
}
function fresh(){ return { current:0, results:{}, current_q:{} }; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

/* --- Statistiques globales --- */
function allQuestions(){
  let arr=[];
  COURSE.forEach((s,si)=>{ (s.quiz||s.exam||[]).forEach((q,qi)=>arr.push({si,qi,q})); });
  return arr;
}
function globalScore(){
  let correct=0,total=0;
  Object.values(state.results).forEach(sec=>{
    Object.values(sec).forEach(r=>{ total++; if(r==='ok')correct++; else if(r==='part')correct+=0.5; });
  });
  const totalQ = allQuestions().length;
  return {correct, answered:total, totalQ, pct: totalQ? Math.round(correct/totalQ*100):0};
}
function levelInfo(){
  const g=globalScore();
  const p=g.pct;
  let name='Débutant';
  if(p>=85) name='Intermédiaire confirmé';
  else if(p>=60) name='Intermédiaire';
  else if(p>=35) name='Débutant avancé';
  else if(p>=12) name='Débutant';
  else name='Grand débutant';
  return {name, pct:p};
}

/* --- Sidebar --- */
function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  COURSE.forEach((s,i)=>{
    const div=document.createElement('div');
    let cls='navitem';
    if(i===state.current) cls+=' active';
    if(s.type==='checkpoint') cls+=' cp';
    if(s.type==='final') cls+=' final';
    const done=sectionDone(i);
    if(done) cls+=' done';
    div.className=cls;
    const icon = s.type==='checkpoint' ? '⚑' : s.type==='final' ? '★' : (done?'✓':(i+1));
    div.innerHTML=`<span class="ic">${icon}</span><span>${s.navtitle||s.title}</span>`;
    div.onclick=()=>{ state.current=i; save(); render(); if(window.innerWidth<=860) document.getElementById('sidebar').classList.remove('open'); };
    nav.appendChild(div);
  });
  const li=levelInfo();
  document.getElementById('lvlName').textContent='Niveau : '+li.name;
  document.getElementById('lvlPct').textContent=li.pct+'%';
  document.getElementById('lvlBar').style.width=li.pct+'%';
}
function sectionDone(i){
  const s=COURSE[i]; const qs=(s.quiz||s.exam||[]);
  if(!qs.length) return false;
  const r=state.results[i]||{};
  return Object.keys(r).length>=qs.length;
}

/* --- Rendu principal --- */
function render(){
  renderNav();
  const s=COURSE[state.current];
  const c=document.getElementById('content');
  window.scrollTo(0,0);
  if(s.type==='final'){ renderFinal(s); return; }
  let html='';
  html+=`<div class="kicker">${s.kicker||(s.type==='checkpoint'?'Checkpoint':'Module '+(sectionNumber(state.current)))}</div>`;
  html+=`<h2 class="title">${s.title}</h2>`;
  if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
  if(s.lesson){ html+=`<div class="card lesson">${s.lesson}</div>`; }
  c.innerHTML=html;
  const qs=(s.quiz||s.exam||[]);
  if(qs.length){
    const holder=document.createElement('div'); holder.id='quizHolder'; c.appendChild(holder);
    startQuiz(state.current);
  }
  // navigation module suivant
  const navFoot=document.createElement('div');
  navFoot.style.cssText='display:flex;justify-content:space-between;margin-top:24px';
  navFoot.innerHTML=`
    <button class="btn" ${state.current===0?'disabled':''} id="prevSec">← Précédent</button>
    <button class="btn primary" ${state.current===COURSE.length-1?'disabled':''} id="nextSec">Section suivante →</button>`;
  c.appendChild(navFoot);
  const pv=document.getElementById('prevSec'), nx=document.getElementById('nextSec');
  if(pv) pv.onclick=()=>{state.current--;save();render();};
  if(nx) nx.onclick=()=>{state.current++;save();render();};
}
function sectionNumber(idx){
  let n=0; for(let i=0;i<=idx;i++){ if(COURSE[i].type==='module') n++; } return n;
}

/* --- Moteur de quiz : une question à la fois --- */
function startQuiz(si){
  const s=COURSE[si];
  const qs=(s.quiz||s.exam||[]);
  if(!state.current_q) state.current_q={};
  // reprendre là où on s'est arrêté
  let idx = state.current_q[si] ?? 0;
  const answered = state.results[si]||{};
  // aller à la première non répondue si en cours
  if(idx>=qs.length) idx=qs.length-1;
  renderQuestion(si, idx);
}

function renderQuestion(si, idx){
  state.current_q[si]=idx; save();
  const s=COURSE[si]; const qs=(s.quiz||s.exam||[]);
  const q=qs[idx];
  const holder=document.getElementById('quizHolder');
  const results=state.results[si]||{};
  const isExam = s.type==='checkpoint'||s.type==='final';

  // barre de progression du quiz
  let dots='';
  qs.forEach((_,i)=>{
    let d='dot';
    if(results[i]==='ok')d+=' ok'; else if(results[i]==='bad')d+=' bad'; else if(results[i]==='part')d+=' part';
    if(i===idx)d+=' cur';
    dots+=`<span class="${d}" title="Q${i+1}"></span>`;
  });

  const dlabel={1:'Facile',2:'Moyen',3:'Difficile'}[q.difficulty||1];
  let html=`<div class="card">
    <div class="quizhead">
      <div class="kicker">${isExam?'Examen':'Quiz'} — Question ${idx+1}/${qs.length}</div>
      <span class="pill d${q.difficulty||1}">${dlabel}</span>
    </div>
    <div class="qprompt">${q.prompt}</div>`;
  if(q.code) html+=code(q.code);

  // corps selon type
  if(q.kind==='mcq'||q.kind==='multi'){
    html+=`<div class="choices" id="choices">`;
    q.choices.forEach((ch,i)=>{
      html+=`<div class="choice ${q.kind==='multi'?'multi':''}" data-i="${i}">
        <span class="mk">${q.kind==='multi'?'':''}</span><div>${ch}</div></div>`;
    });
    html+=`</div>`;
  } else if(q.kind==='tf'){
    html+=`<div class="choices" id="choices">
      <div class="choice" data-i="1"><span class="mk"></span><div>Vrai</div></div>
      <div class="choice" data-i="0"><span class="mk"></span><div>Faux</div></div></div>`;
  } else if(q.kind==='predict'){
    html+=`<input class="answer" id="freeAns" placeholder="Écris la sortie attendue (ou 'erreur de compilation')..." autocomplete="off"/>`;
  } else if(q.kind==='text'){
    html+=`<textarea class="answer" id="freeAns" placeholder="Écris ta réponse ici..."></textarea>`;
  } else if(q.kind==='code'){
    html+=`<textarea class="answer" id="freeAns" placeholder="Écris ton code Rust ici...">${q.starter||''}</textarea>`;
  }

  html+=`<div class="hintbox" id="hintbox">💡 Indice : ${q.hint||'Relis la partie du cours correspondante.'}</div>`;
  html+=`<div class="qfoot">
      <div class="progressline">${dots}</div>
      <div style="display:flex;gap:8px">
        ${q.hint?`<button class="btn small ghost" id="hintBtn">Indice</button>`:''}
        <button class="btn primary" id="checkBtn">Vérifier ma réponse</button>
      </div>
    </div>`;

  // feedback
  html+=`<div class="feedback" id="feedback"></div>`;
  html+=`</div>`;
  holder.innerHTML=html;

  // interactions
  let selected = q.kind==='multi'? new Set() : null;
  const choiceEls=holder.querySelectorAll('.choice');
  choiceEls.forEach(el=>{
    el.onclick=()=>{
      if(el.classList.contains('locked'))return;
      if(q.kind==='multi'){
        const i=+el.dataset.i;
        if(selected.has(i)){selected.delete(i);el.classList.remove('sel');}
        else{selected.add(i);el.classList.add('sel');}
      }else{
        choiceEls.forEach(e=>e.classList.remove('sel'));
        el.classList.add('sel'); selected=+el.dataset.i;
      }
    };
  });
  const hintBtn=document.getElementById('hintBtn');
  if(hintBtn) hintBtn.onclick=()=>document.getElementById('hintbox').classList.add('show');
  document.getElementById('checkBtn').onclick=()=>checkAnswer(si,idx,q,selected,choiceEls);

  // si déjà répondu, montrer l'état
  if(results[idx]){ /* on laisse rejouable, ne bloque pas */ }
}

function checkAnswer(si,idx,q,selected,choiceEls){
  const fb=document.getElementById('feedback');
  let verdict='ok'; // ok | bad | part
  let auto=true;

  if(q.kind==='mcq'||q.kind==='tf'){
    const ans = q.kind==='tf' ? (q.answer?1:0) : q.answer;
    if(selected===null){ toast('Choisis une réponse.'); return; }
    choiceEls.forEach(el=>{
      const i=+el.dataset.i; el.classList.add('locked');
      if(i===ans) el.classList.add('correct');
      if(i===selected && i!==ans) el.classList.add('wrong');
    });
    verdict = selected===ans ? 'ok':'bad';
  } else if(q.kind==='multi'){
    if(!selected||selected.size===0){ toast('Sélectionne au moins une réponse.'); return; }
    const ans=new Set(q.answer);
    choiceEls.forEach(el=>{
      const i=+el.dataset.i; el.classList.add('locked');
      if(ans.has(i)) el.classList.add('correct');
      if(selected.has(i)&&!ans.has(i)) el.classList.add('wrong');
    });
    const sel=[...selected].sort().join(','), good=[...ans].sort().join(',');
    verdict = sel===good ? 'ok' : ( [...selected].every(x=>ans.has(x)) ? 'part':'bad');
  } else {
    // réponses libres : auto-évaluation par mots-clés + auto-évaluation utilisateur
    auto=false;
    const val=(document.getElementById('freeAns').value||'').trim();
    if(!val){ toast('Écris ta réponse avant de vérifier.'); return; }
    verdict = gradeFree(val,q);
  }

  // rendu feedback
  const vlabel={ok:'✅ Correct',bad:'❌ Incorrect',part:'🟡 Partiellement correct'}[verdict];
  let fbHtml=`<div class="verdict ${verdict}">${vlabel}</div>`;
  if(!auto && q.model){ fbHtml+=`<div style="margin:8px 0"><strong>Réponse / solution attendue :</strong></div>`+ (q.modelCode?code(q.model):`<div>${q.model}</div>`); }
  fbHtml+=`<div style="margin-top:10px"><strong>Explication détaillée :</strong><br>${q.explain}</div>`;

  if(!auto){
    fbHtml+=`<div class="selfassess">
      <span class="lab">Auto-évaluation honnête — as-tu réussi ?</span>
      <button class="btn small" data-v="ok">✅ Oui</button>
      <button class="btn small" data-v="part">🟡 En partie</button>
      <button class="btn small" data-v="bad">❌ Non</button>
    </div>`;
  }
  fbHtml+=`<div class="qfoot" style="margin-top:16px">
      <span style="color:var(--muted);font-size:13px" id="adaptNote"></span>
      <button class="btn primary" id="nextQ">Question suivante →</button>
    </div>`;
  fb.innerHTML=fbHtml; fb.classList.add('show');
  document.getElementById('checkBtn').disabled=true;

  const s=COURSE[si]; const qs=(s.quiz||s.exam||[]);
  const finishThis=(v)=>{
    recordResult(si,idx,v);
    adaptNote(si,idx,v);
    const nextBtn=document.getElementById('nextQ');
    nextBtn.onclick=()=>{
      if(idx+1<qs.length){ renderQuestion(si,idx+1); }
      else { showSectionSummary(si); }
    };
  };

  if(auto){ finishThis(verdict); }
  else{
    // attendre l'auto-évaluation
    fb.querySelectorAll('.selfassess .btn').forEach(b=>{
      b.onclick=()=>{
        fb.querySelectorAll('.selfassess .btn').forEach(x=>x.style.opacity=.4);
        b.style.opacity=1;
        finishThis(b.dataset.v);
      };
    });
    // par défaut, on enregistre l'estimation par mots-clés tant que l'utilisateur n'a pas cliqué
    finishThis(verdict);
  }
}

function gradeFree(val,q){
  const low=val.toLowerCase();
  if(q.kind==='predict' && q.expect){
    const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
    if(norm(val)===norm(q.expect)) return 'ok';
    // tolérance : contient l'essentiel
    if(q.expect && norm(val).includes(norm(q.expect).slice(0,Math.max(3,q.expect.length-2)))) return 'part';
    if(!q.keywords || !q.keywords.length) return 'bad';
  }
  if(q.keywords && q.keywords.length){
    const hits=q.keywords.filter(k=>low.includes(k.toLowerCase())).length;
    const ratio=hits/q.keywords.length;
    if(ratio>=0.7) return 'ok';
    if(ratio>=0.35) return 'part';
    return 'bad';
  }
  return 'part';
}

function recordResult(si,idx,v){
  if(!state.results[si]) state.results[si]={};
  state.results[si][idx]=v; save(); renderNav();
}

/* Difficulté adaptative : message + suggestion */
function adaptNote(si,idx,v){
  const note=document.getElementById('adaptNote'); if(!note)return;
  // regarde les 3 dernières réponses de la section
  const r=state.results[si]||{};
  const recent=[];
  for(let i=Math.max(0,idx-2);i<=idx;i++){ if(r[i]) recent.push(r[i]); }
  const bad=recent.filter(x=>x==='bad').length;
  const ok=recent.filter(x=>x==='ok').length;
  if(bad>=2){ note.innerHTML='🔻 <b>On ralentit.</b> Relis la section ci-dessus avant de continuer — ce concept est important.'; }
  else if(ok>=3){ note.innerHTML='🔺 <b>Excellent enchaînement !</b> Tu peux viser les questions difficiles suivantes sans crainte.'; }
  else if(v==='ok'){ note.innerHTML='👍 Bien joué.'; }
  else if(v==='part'){ note.innerHTML='🟡 Presque — relis l’explication.'; }
  else { note.innerHTML='Reprends le point correspondant dans le cours.'; }
}

/* Résumé de fin de section (module ou checkpoint) */
function showSectionSummary(si){
  const s=COURSE[si]; const qs=(s.quiz||s.exam||[]);
  const r=state.results[si]||{};
  let ok=0,part=0,bad=0;
  qs.forEach((_,i)=>{ if(r[i]==='ok')ok++; else if(r[i]==='part')part++; else if(r[i]==='bad')bad++; });
  const score=ok+part*0.5, pct=Math.round(score/qs.length*100);
  const holder=document.getElementById('quizHolder');

  // lacunes = questions manquées, regroupées par tag
  const weakTags={};
  qs.forEach((qq,i)=>{ if(r[i]==='bad'||r[i]==='part'){ (qq.tags||['divers']).forEach(t=>weakTags[t]=(weakTags[t]||0)+1); } });
  const weakList=Object.entries(weakTags).sort((a,b)=>b[1]-a[1]);

  let msg;
  if(pct>=85) msg="Maîtrise solide 🎯 — tu peux avancer sereinement.";
  else if(pct>=60) msg="Bon niveau 👍 — quelques points à consolider.";
  else msg="À retravailler ⚠️ — révise la section avant de poursuivre.";

  let html=`<div class="card summary">
    <div class="kicker">${s.type==='checkpoint'?'Bilan du checkpoint':'Bilan du module'}</div>
    <h2 class="title" style="font-size:24px">${msg}</h2>
    <div class="statgrid">
      <div class="stat"><div class="n" style="color:var(--ok)">${ok}</div><div class="l">Réussies</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${part}</div><div class="l">Partielles</div></div>
      <div class="stat"><div class="n" style="color:var(--bad)">${bad}</div><div class="l">Manquées</div></div>
      <div class="stat"><div class="n">${pct}%</div><div class="l">Score section</div></div>
    </div>`;
  if(weakList.length){
    html+=`<h4 style="color:var(--acc2)">🎯 Révisions ciblées recommandées :</h4>`;
    weakList.forEach(([t,n])=>{ html+=`<div class="weak"><b>${t}</b> — ${n} question(s) à revoir. Relis la partie correspondante puis rejoue le quiz.</div>`; });
  } else {
    html+=`<div class="weak" style="background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.4)">Aucune lacune détectée sur cette section. 🌟</div>`;
  }
  html+=`<div class="qfoot" style="margin-top:18px">
      <button class="btn" id="retryQuiz">↻ Rejouer le quiz</button>
      <button class="btn primary" id="goNext">${si<COURSE.length-1?'Section suivante →':'Terminé'}</button>
    </div></div>`;
  holder.innerHTML=html;
  document.getElementById('retryQuiz').onclick=()=>{ state.current_q[si]=0; save(); renderQuestion(si,0); };
  const gn=document.getElementById('goNext');
  gn.onclick=()=>{ if(si<COURSE.length-1){state.current=si+1;state.current_q[si]=0;save();render();} };
}

/* --- Examen final : bilan global détaillé --- */
function renderFinal(s){
  const c=document.getElementById('content');
  const g=globalScore();
  const li=levelInfo();
  let html=`<div class="kicker">Examen final & évaluation</div>
    <h2 class="title">${s.title}</h2>
    <div class="sub">${s.sub||''}</div>`;
  if(s.lesson) html+=`<div class="card lesson">${s.lesson}</div>`;
  c.innerHTML=html;
  const holder=document.createElement('div'); holder.id='quizHolder'; c.appendChild(holder);
  startQuiz(state.current);

  // bouton pour afficher l'évaluation globale
  const evalCard=document.createElement('div');
  evalCard.className='card summary';
  evalCard.innerHTML=`<div class="kicker">Évaluation globale du parcours</div>
    <h3 style="margin:6px 0">Ton niveau estimé : <span class="badge" style="background:linear-gradient(135deg,var(--acc),#b03400);color:#fff">${li.name}</span></h3>
    <div class="statgrid">
      <div class="stat"><div class="n">${g.pct}%</div><div class="l">Score global</div></div>
      <div class="stat"><div class="n">${Math.round(g.correct)}</div><div class="l">Points obtenus</div></div>
      <div class="stat"><div class="n">${g.answered}</div><div class="l">Questions traitées</div></div>
      <div class="stat"><div class="n">${g.totalQ}</div><div class="l">Total questions</div></div>
    </div>
    <div id="roadmap"></div>`;
  c.appendChild(evalCard);
  renderRoadmap(li);

  const navFoot=document.createElement('div');
  navFoot.style.cssText='display:flex;justify-content:space-between;margin-top:24px';
  navFoot.innerHTML=`<button class="btn" id="prevSec">← Précédent</button><span></span>`;
  c.appendChild(navFoot);
  document.getElementById('prevSec').onclick=()=>{state.current--;save();render();};
}
function renderRoadmap(li){
  const el=document.getElementById('roadmap'); if(!el)return;
  // lacunes globales par tag
  const tagFail={};
  COURSE.forEach((s,si)=>{ const qs=(s.quiz||s.exam||[]); const r=state.results[si]||{};
    qs.forEach((q,i)=>{ if(r[i]==='bad'||r[i]==='part'){ (q.tags||[]).forEach(t=>tagFail[t]=(tagFail[t]||0)+1);} }); });
  const weak=Object.entries(tagFail).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let h=`<h4 style="color:var(--acc2)">🩺 Diagnostic de tes lacunes</h4>`;
  if(weak.length){ h+='<ul>'; weak.forEach(([t,n])=>h+=`<li><b>${t}</b> — ${n} erreur(s). À retravailler en priorité.</li>`); h+='</ul>'; }
  else h+='<p>Aucune lacune majeure détectée — excellent ! 🌟</p>';
  h+=`<h4 style="color:var(--acc2)">🗺️ Feuille de route vers le niveau avancé</h4>
  <ol>
    <li><b>Fonctions de fenêtrage avancées</b> : <code>FRAME</code> (ROWS/RANGE BETWEEN), <code>LAG/LEAD</code>, moyennes mobiles, cumuls, top-N par groupe.</li>
    <li><b>CTE & requêtes récursives</b> : <code>WITH RECURSIVE</code> pour hiérarchies (organigrammes, graphes, nomenclatures).</li>
    <li><b>Optimisation & index</b> : lire un <code>EXPLAIN ANALYZE</code>, index B-tree/partiels/composites, sélectivité, éviter les <i>full scans</i>.</li>
    <li><b>Modélisation</b> : normalisation (1NF→3NF), clés, contraintes, schémas en étoile/flocon (data warehouse).</li>
    <li><b>Transactions & concurrence</b> : niveaux d’isolation (ACID), verrous, <code>MVCC</code>, deadlocks.</li>
    <li><b>SQL analytique / Big Data</b> : <code>GROUPING SETS</code>, <code>ROLLUP/CUBE</code>, pivots ; dialectes distribués (BigQuery, Spark SQL, DuckDB).</li>
    <li><b>NoSQL & au-delà</b> : quand quitter le relationnel (MongoDB, Redis), JSONB en Postgres, bases colonnes.</li>
    <li>Pratique : <i>SQLBolt</i>, <i>pgexercises</i>, <i>Advanced SQL (Mode Analytics)</i>, et un vrai projet d’analyse sur un dataset.</li>
  </ol>`;
  el.innerHTML=h;
}

/* --- Contrôles UI --- */
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Réinitialiser toute ta progression ?')){ state=fresh(); save(); render(); toast('Progression réinitialisée.'); }
};
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

/* --- Démarrage : on attend que le contenu soit chargé --- */
function boot(){ if(COURSE.length===0){ setTimeout(boot,30); return; } if(state.current>=COURSE.length) state.current=0; render(); }
boot();
</script>
