<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<title>Cursus Rust — Débutant → Intermédiaire</title>
<style>
  :root{
    --bg:#0f1117; --bg2:#171a23; --bg3:#1e2230; --panel:#141822;
    --txt:#e6e9ef; --muted:#9aa4b2; --line:#2a3040;
    --acc:#f74c00; --acc2:#ffb27a; --ok:#3ecf8e; --bad:#ff5d6c;
    --warn:#ffcf5c; --blue:#5aa9ff; --purple:#b98cff;
    --code:#11141d;
    --radius:14px;
    --mono:"JetBrains Mono","Fira Code",Consolas,Menlo,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 80% -10%,#1a1410 0%,var(--bg) 55%);
    color:var(--txt);font-family:var(--sans);line-height:1.6;font-size:16px;
  }
  a{color:var(--blue)}
  .app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
  /* Sidebar */
  aside{
    background:linear-gradient(180deg,var(--bg2),var(--bg));
    border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .logo{
    width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--acc),#b03400);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:20px;box-shadow:0 6px 18px rgba(247,76,0,.35)
  }
  .brand h1{font-size:17px;margin:0;line-height:1.2}
  .brand small{color:var(--muted);font-size:12px}
  .levelbar{margin:14px 0 8px}

  .navitem.active{background:var(--bg3);color:var(--txt);border-color:var(--line)}

  .lesson h4{margin-top:20px;font-size:16px;color:var(--acc2)}

  .lesson ul,.lesson ol{margin:8px 0 8px 4px;padding-left:22px}

  .lesson th,.lesson td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}

  .verdict{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.part{color:var(--warn)}
  .selfassess{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .selfassess .lab{color:var(--muted);font-size:14px;margin-right:4px}
  .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
  .progressline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--bg3);border:1px solid var(--line)}
  .dot.ok{background:var(--ok);border-color:var(--ok)}
  .dot.bad{background:var(--bad);border-color:var(--bad)}
  .dot.part{background:var(--warn);border-color:var(--warn)}
  .dot.cur{box-shadow:0 0 0 3px rgba(247,76,0,.35)}
  .hintbox{margin-top:12px;font-size:14px;color:var(--warn);display:none}
  .hintbox.show{display:block}
  .summary .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
  .stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .n{font-size:26px;font-weight:800}
  .stat .l{color:var(--muted);font-size:13px}
  .badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px}
  .weak{background:rgba(255,93,108,.1);border:1px solid rgba(255,93,108,.4);border-radius:10px;padding:10px 14px;margin:8px 0}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line);
    padding:10px 18px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  .topbar-m{display:none}
  @media(max-width:860px){
      html,body{overflow-x:hidden}
      .app{grid-template-columns:1fr}
      aside{position:fixed;z-index:40;left:-320px;width:min(300px,85vw);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.5);padding-left:max(16px,env(safe-area-inset-left))}
      aside.open{left:0}
      main{padding:18px 16px 80px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
      .topbar-m{display:flex;gap:12px;align-items:center;margin-bottom:14px;position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);padding:6px 0}
    }
    @media(max-width:520px){
      .card{padding:16px 15px}
      main{font-size:15.5px}
      .kicker,h2{font-size:22px}
      pre code{font-size:12.5px}
      .choice{padding:12px 13px;min-height:46px}
      .choices{gap:8px}
      .btn{min-height:42px}
      table{display:block;overflow-x:auto;white-space:nowrap}
      .answer{min-height:100px}
    }
</style>

<script>
/* ============================================================
   MOTEUR DE QUIZ + CONTENU DU COURS
   ============================================================ */

/* ---------- Coloration syntaxique très simple pour Rust ---------- */
function hl(src){
  const kw=/\b(let|mut|fn|struct|enum|impl|trait|for|while|loop|if|else|match|return|use|mod|pub|crate|self|Self|as|ref|move|where|dyn|const|static|type|in|break|continue|unsafe|async|await)\b/g;
  const ty=/\b(i8|i16|i32|i64|i128|u8|u16|u32|u64|u128|usize|isize|f32|f64|bool|char|str|String|Vec|Option|Result|Box|Rc|Arc|RefCell|HashMap|Some|None|Ok|Err)\b/g;
  // échappement HTML
  let s=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // On met de côté commentaires et chaines pour ne PAS les recolorer ensuite
  const store=[];
  const stash=(html)=>{ store.push(html); return '\uE000'+String.fromCharCode(0xE100+store.length-1)+'\uE001'; };
  s=s.replace(/(\/\/[^\n]*)/g,(m)=>stash('<span class=tok-cmt>'+m+'</span>'));       // commentaires
  s=s.replace(/("(?:[^"\\]|\\.)*")/g,(m)=>stash('<span class=tok-lit>'+m+'</span>')); // chaines
  s=s.replace(/\b([a-zA-Z_]\w*!)/g,'<span class=tok-mac>$1</span>');                  // macros
  s=s.replace(/\b(\d[\d_]*(?:\.\d+)?)\b/g,'<span class=tok-num>$1</span>');           // nombres
  s=s.replace(ty,'<span class=tok-ty>$1</span>');
  s=s.replace(kw,'<span class=tok-kw>$1</span>');
  // restauration des commentaires/chaines
  s=s.replace(/\uE000([\uE100-\uE1FF])\uE001/g,(m,c)=>store[c.charCodeAt(0)-0xE100]);
  return s;
}
function code(src){return '<pre><code>'+hl(src.replace(/^\n/,'').replace(/\s+$/,''))+'</code></pre>';}

/* Callouts helpers */
const why =(t)=>`<div class="callout why"><div class="h">💡 Le « pourquoi » de Rust</div>${t}</div>`;
const py  =(t)=>`<div class="callout py"><div class="h">🐍 Comparaison Python</div>${t}</div>`;
const trap=(t)=>`<div class="callout trap"><div class="h">⚠️ Piège fréquent</div>${t}</div>`;
const cerr=(t)=>`<div class="callout err"><div class="h">🧯 Erreur de compilation typique</div>${t}</div>`;

/* ============================================================
   DONNÉES DU COURS
   Types de question :
   - mcq   : choix unique (answer = index)
   - multi : choix multiple (answer = [indices])
   - tf    : vrai/faux (answer = true/false)
   - text  : réponse libre courte, auto-évaluée (model + explain)
   - predict: prédiction de sortie, auto-évaluée
   - code  : écriture/refactoring de code, auto-évaluée
   ============================================================ */
const COURSE = [];
</script>

<!-- Le contenu (modules, checkpoints, examen) est injecté ci-dessous -->
<script>
/* ================= MODULE 1 — Installation, Cargo & outils ================= */
COURSE.push({
  type:'module', navtitle:'1 · Cargo & outils',
  title:'Module 1 — Installation, Cargo & la chaîne d’outils',
  sub:'Mettre en place un environnement Rust professionnel et comprendre le rôle de chaque outil.',
  lesson:
    `<p>Rust est un langage <b>compilé</b>, <b>statiquement typé</b> et sans ramasse-miettes (garbage collector). Avant d’écrire du code, il faut comprendre son écosystème d’outils, qui est l’un des plus soignés de l’industrie.</p>
    <h3>Installer Rust : <code>rustup</code></h3>
    <p><code>rustup</code> est le gestionnaire d’installation officiel. Il installe et met à jour le compilateur et les outils, et gère plusieurs versions (« toolchains »).</p>
    `+code(`# Installer Rust (Linux/macOS)
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh

# Vérifier les versions
rustc --version   # le compilateur
cargo --version   # le gestionnaire de projet
rustup update     # mettre à jour`)+
    `<h3>Les outils clés</h3>
    <table>
      <tr><th>Outil</th><th>Rôle</th><th>Équivalent Python (approx.)</th></tr>
      <tr><td><code>rustc</code></td><td>Le compilateur bas niveau</td><td><code>CPython</code></td></tr>
      <tr><td><code>cargo</code></td><td>Build system + gestionnaire de paquets + lanceur de tests</td><td><code>pip</code> + <code>venv</code> + <code>build</code> + <code>pytest</code> réunis</td></tr>
      <tr><td><code>rustfmt</code></td><td>Formateur automatique (<code>cargo fmt</code>)</td><td><code>black</code></td></tr>
      <tr><td><code>clippy</code></td><td>Linter très riche (<code>cargo clippy</code>)</td><td><code>ruff</code> / <code>pylint</code></td></tr>
      <tr><td><code>rust-analyzer</code></td><td>Serveur de langage pour l’IDE (autocomplétion, erreurs en direct)</td><td><code>pylance</code></td></tr>
    </table>
    <h3>Créer et lancer un projet</h3>
    `+code(`cargo new mon_projet      # crée un projet binaire (avec un main)
cargo new ma_lib --lib    # crée une bibliothèque

cd mon_projet
cargo run                 # compile PUIS exécute
cargo build               # compile seulement (cible debug)
cargo build --release     # compile optimisé (plus lent à compiler, rapide à l'exécution)
cargo check               # vérifie la compilation SANS produire de binaire (très rapide)
cargo test                # lance les tests
cargo fmt                 # reformate le code
cargo clippy              # analyse le code`)+
    `<h3>Structure d’un projet Cargo</h3>
    `+code(`mon_projet/
├── Cargo.toml      # manifeste : nom, version, dépendances
├── Cargo.lock      # versions exactes verrouillées (comme requirements.lock / poetry.lock)
└── src/
    └── main.rs     # point d'entrée`)+
    `<p>Le fichier <code>Cargo.toml</code> décrit le paquet. Ajouter une dépendance (un « crate ») :</p>
    `+code(`# Dans Cargo.toml
[dependencies]
rand = "0.8"

# ou en ligne de commande :
# cargo add rand`)+
    `<h3>Le premier programme</h3>
    `+code(`fn main() {
    println!("Bonjour, Rust !");
}`)+
    py(`En Python, un script <code>hello.py</code> s’exécute directement avec <code>python hello.py</code>, sans compilation ni <code>main</code> obligatoire. En Rust, tout binaire a une fonction <code>main</code>, et le code est <b>compilé</b> en exécutable natif avant de tourner. <code>println!</code> est une <b>macro</b> (le <code>!</code> le signale), pas une fonction.`)+
    why(`<code>cargo check</code> existe parce que la compilation complète de Rust peut être lente (vérifications poussées + optimisations). <code>check</code> effectue toute l’analyse de types et d’emprunts <b>sans</b> générer de code machine : c’est la boucle de feedback rapide qu’on utilise en développement.`)+
    trap(`Ne confonds pas <b>debug</b> et <b>release</b>. Par défaut <code>cargo run</code> compile en mode debug : le binaire est lent et gros mais compile vite et garde les vérifications de débordement. Pour mesurer les performances, utilise toujours <code>--release</code>.`),
  culture:
    `<div class="chead"><span class="cic">📜</span><span class="ctitle">Culture &amp; histoire de Rust</span><span class="ctag">hors programme · pour le plaisir</span></div>
    <p class="csub">Un encart à l'écart du cours : d'où vient Rust, qui l'a créé, et pourquoi il séduit autant.</p>

  type:'module', navtitle:'3 · Tuples, tableaux, slices',
  title:'Module 3 — Types composés : tuples, tableaux & slices',
  sub:'Regrouper des valeurs. Introduction douce à une idée centrale : les slices.',
  lesson:
    `<h3>Tuples</h3>
    <p>Un <b>tuple</b> regroupe des valeurs de types éventuellement différents, avec une taille <b>fixe</b>.</p>
    `+code(`let tup: (i32, f64, char) = (500, 6.4, 'z');
let (x, y, z) = tup;          // déstructuration

    <p>Un <b>tableau</b> a une taille fixe et des éléments du <b>même type</b>. Il vit généralement sur la pile (stack).</p>
    `+code(`let a = [1, 2, 3, 4, 5];        // [i32; 5]
let b: [i32; 3] = [0; 3];      // [0, 0, 0] (répétition)

    `<h3>Vec vs tableau</h3>
    <p>Le tableau <code>[T; N]</code> a une taille figée. Pour une liste <b>dynamique</b>, on utilise <code>Vec&lt;T&gt;</code> (Module 9), l’équivalent de la <code>list</code> Python.</p>
    <h3>Slices — l’idée clé</h3>
    <p>Un <b>slice</b> <code>&[T]</code> est une <b>vue empruntée</b> sur une portion contiguë d’un tableau, d’un <code>Vec</code> ou d’une chaîne : un couple (pointeur, longueur). Il ne possède <b>pas</b> les données — il les référence.</p>
    `+code(`let a = [10, 20, 30, 40, 50];
let milieu = &a[1..4];   // &[i32] -> [20, 30, 40] (fin exclusive)
let debut  = &a[..2];    // [10, 20]
let tout   = &a[..];     // le tableau entier

let mot = String::from("bonjour");
let bon = &mot[0..3];    // &str -> "bon" (slice de chaîne)`)+
    why(`Les slices sont fondamentaux : ils permettent d’écrire des fonctions qui travaillent indifféremment sur un tableau, un <code>Vec</code> ou une sous-partie, <b>sans copier</b> les données. Une fonction qui prend <code>&[i32]</code> accepte <code>&mon_tableau</code> comme <code>&mon_vec</code>. C’est plus flexible et plus performant que de passer la collection entière.</p>
    <p>Attention : <code>&str</code> est un slice de chaîne UTF-8. Découper au milieu d’un caractère multi-octets (ex. <code>&mot[0..1]</code> sur « é ») <b>panique</b>, car les indices sont en <b>octets</b>.`)+

    { kind:'mcq', difficulty:2, tags:['slices'],

    { kind:'tf', difficulty:2, tags:['slices','ownership'],

    { kind:'mcq', difficulty:2, tags:['tableaux','sécurité'],
      prompt:'Que fait <code>a[10]</code> si <code>a</code> n’a que 5 éléments ?',

    { kind:'text', difficulty:3, tags:['slices','fonctions'],

/* ================= MODULE 4 — Fonctions, expressions vs statements, contrôle de flux ================= */
COURSE.push({
  type:'module', navtitle:'4 · Fonctions & flux',
  title:'Module 4 — Fonctions, expressions vs statements & contrôle de flux',
  sub:'Une distinction fondamentale : en Rust, presque tout est une expression qui produit une valeur.',
  lesson:
    `<h3>Fonctions</h3>
    `+code(`fn addition(a: i32, b: i32) -> i32 {
    a + b          // PAS de point-virgule : c'est l'expression de retour
}

fn saluer(nom: &str) {   // pas de "-> " => retourne () (unit)
    println!("Salut {nom}");
}`)+
    trap(`Le type des paramètres est <b>obligatoire</b> (pas d’inférence sur les signatures). Le type de retour aussi, sauf s’il vaut <code>()</code>.`)+
    `<h3>Expressions vs statements — LE point à comprendre</h3>
    <ul>
      <li>Une <b>instruction</b> (statement) exécute une action et ne renvoie <b>pas</b> de valeur : <code>let x = 5;</code></li>
      <li>Une <b>expression</b> produit une <b>valeur</b> : <code>5 + 3</code>, un appel de fonction, un bloc <code>{ ... }</code>, un <code>if</code>, un <code>match</code>…</li>
    </ul>
    `+code(`let y = {
    let a = 3;
    a + 1        // pas de ; -> le bloc VAUT 4
};               // y == 4

let z = if y > 2 { "grand" } else { "petit" };  // if est une EXPRESSION`)+
    cerr(`Ajouter un point-virgule transforme une expression en instruction qui vaut <code>()</code> :<br><code>fn f() -&gt; i32 { 5; }</code> → <code>error[E0308]: mismatched types, expected i32, found ()</code>. Retire le <code>;</code> après <code>5</code>.`)+
    why(`Faire du <code>if</code>, du <code>match</code> et des blocs des <b>expressions</b> supprime le besoin d’un opérateur ternaire séparé et rend le code plus composable : on peut affecter directement le résultat d’un branchement. Le <code>;</code> devient porteur de sens (il « jette » la valeur).`)+
    py(`Python distingue aussi expressions et instructions, mais son <code>if</code> classique n’est pas une expression (il faut <code>a if cond else b</code>). En Rust, <b>le même</b> <code>if</code> sert partout et renvoie une valeur. Autre différence : le <code>return</code> explicite est rare en Rust — on laisse la dernière expression.`)+
    `<h3>Contrôle de flux</h3>
    `+code(`// if / else if / else (les conditions sont des bool STRICTS : pas de "truthy")
if n % 2 == 0 { println!("pair"); } else { println!("impair"); }

// loop : boucle infinie qui peut RENVOYER une valeur via break
let resultat = loop {
    compteur += 1;
    if compteur == 10 { break compteur * 2; }  // renvoie 20
};

// while
while n > 0 { n -= 1; }

// for sur un intervalle ou un itérable
for i in 0..5 { print!("{i} "); }        // 0 1 2 3 4

    `+code(`use std::sync::mpsc;   // multi-producer, single-consumer

fn main() {

    thread::spawn(move || {
        for i in 0..3 {
            tx.send(i).unwrap();   // envoie i (le transfère)
        }

    for recu in rx {               // itère jusqu'à fermeture du canal

    }
}`)+

      choices:[
        'Pour la syntaxe uniquement',
        'Pour déclarer explicitement les capacités utilisées, vérifiées à la compilation',
        'Pour rendre le code plus lent',
        'Ce n’est jamais nécessaire'],
      answer:1, explain:'Un <code>T</code> non contraint n’offre aucune opération. Le bound déclare ce dont le code a besoin (affichage, comparaison…), vérifié à la définition.'},
    { kind:'mcq', difficulty:3, tags:['lifetimes'],
      prompt:'Le rôle d’une annotation de durée de vie <code>\'a</code> est de :',
      choices:[
        'prolonger la vie d’une donnée',
        'relier les durées de vie des références pour que le compilateur vérifie la validité',
        'allouer sur le tas',
        'activer le GC'],
      answer:1, explain:'<code>\'a</code> ne change rien à la vie réelle : il exprime des relations vérifiables, empêchant les références pendouillantes.'},
    { kind:'mcq', difficulty:2, tags:['smart pointers'],
      prompt:'Pour un type récursif (liste chaînée), on a besoin de :',
      choices:['<code>Rc</code>','<code>Box</code>','<code>RefCell</code>','<code>Mutex</code>'],
      answer:1, explain:'<code>Box</code> introduit une indirection de taille fixe → borne la taille du type récursif.'},
    { kind:'mcq', difficulty:3, tags:['RefCell'],
      prompt:'<code>RefCell</code> déplace la vérification d’emprunt :',
      choices:['à la compilation','à l’exécution (panique si violée)','au linker','elle est désactivée'],
      answer:1, explain:'Mutabilité intérieure : <code>borrow()</code>/<code>borrow_mut()</code> vérifient au runtime, et paniquent en cas de violation.'},
    { kind:'mcq', difficulty:3, tags:['concurrence'],
      prompt:'Partager un compteur mutable entre threads :',
      choices:['<code>Rc&lt;RefCell&lt;i32&gt;&gt;</code>','<code>Arc&lt;Mutex&lt;i32&gt;&gt;</code>','<code>Box&lt;i32&gt;</code>','un global mutable'],
      answer:1, explain:'<code>Arc</code> (partage thread-safe) + <code>Mutex</code> (exclusion). <code>Rc/RefCell</code> ne sont pas <code>Send/Sync</code>.'},
    { kind:'mcq', difficulty:2, tags:['modules','visibilité'],
      prompt:'Visibilité par défaut d’un item dans un module :',
      choices:['public','privé','protégé','statique'],
      answer:1, explain:'Privé par défaut ; <code>pub</code> pour exposer. Encapsulation stricte, API explicite.'},
    { kind:'predict', difficulty:3, tags:['borrowing'], expect:'erreur de compilation',
      prompt:'Compile-t-il ?',
      code:`fn main() {
    let mut v = vec![1, 2, 3];
    let r = &v[0];
    v.push(4);
    println!("{r}");
}`,
      model:'Erreur E0502.', hint:'push peut réallouer le Vec.',
      explain:'<code>r</code> emprunte <code>v</code> en lecture et est utilisé après <code>push</code> (emprunt mutable) → conflit. Déplacer <code>println!</code> avant <code>push</code> corrige.'},
    { kind:'code', difficulty:3, tags:['error handling','?'],
      prompt:'Écris <code>fn parse_somme(entrees: &[&str]) -> Result&lt;i32, std::num::ParseIntError&gt;</code> qui parse chaque chaîne en i32 et renvoie leur somme, en propageant la 1re erreur avec <code>?</code>.',
      starter:'fn parse_somme(entrees: &[&str]) -> Result<i32, std::num::ParseIntError> {\n    \n}',
      hint:'Boucle + let n: i32 = s.parse()?; accumulateur.',
      keywords:['parse','?','Ok','for','+='],
      modelCode:true,
      model:`fn parse_somme(entrees: &[&str]) -> Result<i32, std::num::ParseIntError> {
    let mut total = 0;
    for s in entrees {
        let n: i32 = s.parse()?;   // propage la 1re erreur
        total += n;
    }
    Ok(total)
}
// Idiomatique : entrees.iter().map(|s| s.parse::<i32>()).sum()`,
      explain:'<code>?</code> extrait l’<code>i32</code> ou quitte avec l’erreur de parsing. La version avec <code>.sum()</code> sur un itérateur de <code>Result</code> renvoie directement un <code>Result</code> et court-circuite à la première erreur.'},
    { kind:'text', difficulty:3, tags:['synthèse','ownership','traits'],
      prompt:'En 3–4 phrases, explique à un développeur Python ce qui rend Rust fondamentalement différent, en citant ownership, borrowing et l’absence de GC.',
      hint:'Sécurité mémoire à la compilation, coût zéro, erreurs comme valeurs.',
      keywords:['ownership','borrow','gc','compilation','sûr','mémoire','coût','erreur'],
      model:'Rust garantit la <b>sécurité mémoire sans ramasse-miettes</b> : l’<b>ownership</b> (un propriétaire unique, libération automatique) et le <b>borrowing</b> (lecteurs multiples XOR un écrivain) sont vérifiés <b>à la compilation</b>, éliminant use-after-free, double-free et data races sans coût à l’exécution. Là où Python résout « qui libère » via un GC au runtime et signale les échecs par exceptions, Rust résout tout statiquement et fait des erreurs des <b>valeurs typées</b> (<code>Result</code>/<code>Option</code>). Le prix est une phase d’apprentissage (ownership, lifetimes, traits) en échange de performances natives et d’une robustesse forte.',
      explain:'Points clés attendus : sécurité mémoire garantie à la compilation, pas de GC (coût zéro), ownership/borrowing comme mécanismes centraux, erreurs comme valeurs plutôt qu’exceptions, et le compromis apprentissage ↔ performance/robustesse. Si tu as cité tout cela, tu as le modèle mental correct de Rust.'}
  ]
});
</script>
<script>
/* ============================================================
   MOTEUR : rendu, navigation, scoring, adaptativité
   ============================================================ */
const LS_KEY = "rust_cursus_v1";
let state = load();

function load(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || fresh(); }
  catch(e){ return fresh(); }
}
function fresh(){ return { current:0, results:{}, current_q:{} }; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

/* --- Statistiques globales --- */
function allQuestions(){
  let arr=[];
  COURSE.forEach((s,si)=>{ (s.quiz||s.exam||[]).forEach((q,qi)=>arr.push({si,qi,q})); });
  return arr;
}
function globalScore(){
  let correct=0,total=0;
  Object.values(state.results).forEach(sec=>{
    Object.values(sec).forEach(r=>{ total++; if(r==='ok')correct++; else if(r==='part')correct+=0.5; });
  });
  const totalQ = allQuestions().length;
  return {correct, answered:total, totalQ, pct: totalQ? Math.round(correct/totalQ*100):0};
}
function levelInfo(){
  const g=globalScore();
  const p=g.pct;
  let name='Débutant';
  if(p>=85) name='Intermédiaire confirmé';
  else if(p>=60) name='Intermédiaire';
  else if(p>=35) name='Débutant avancé';
  else if(p>=12) name='Débutant';
  else name='Grand débutant';
  return {name, pct:p};
}

/* --- Blocs de niveau (regroupement sidebar) --- */
let blockStart = {};
function computeBlocks(){
  blockStart = {};
  let startIdx = 0;
  for(let i=0;i<COURSE.length;i++){
    const s=COURSE[i];
    if(s.type==='checkpoint'){
      const name=(s.navtitle||'').replace(/^⚑\s*Checkpoint\s*:\s*/,'').trim() || 'Niveau';
      blockStart[startIdx]=name;
      startIdx=i+1;
    }
  }
  if(startIdx<COURSE.length){
    const last=COURSE[COURSE.length-1];
    blockStart[startIdx] = last.type==='final' ? 'Intermédiaire → Examen' : 'Perfectionnement';
  }
}

/* --- Deep-linking par ancre (#m5, #checkpoint-1, #final) --- */
let suppressHash=false;
function anchorFor(i){
  const s=COURSE[i];
  if(s.type==='final') return 'final';
  if(s.type==='checkpoint'){ let n=0; for(let k=0;k<=i;k++) if(COURSE[k].type==='checkpoint') n++; return 'checkpoint-'+n; }
  return 'm'+sectionNumber(i);
}
function indexForAnchor(a){
  if(!a) return null;
  a=String(a).replace(/^#/,'');
  for(let i=0;i<COURSE.length;i++){ if(anchorFor(i)===a) return i; }
  const m=a.match(/^module-(\d+)$/); // tolère la forme longue
  if(m){ for(let i=0;i<COURSE.length;i++){ if(COURSE[i].type==='module' && String(sectionNumber(i))===m[1]) return i; } }
  return null;
}

/* --- Sidebar --- */
function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  computeBlocks();
  COURSE.forEach((s,i)=>{
    const div=document.createElement('div');
    let cls='navitem';
    if(i===state.current) cls+=' active';
    if(s.type==='checkpoint') cls+=' cp';
    if(s.type==='final') cls+=' final';
    const done=sectionDone(i);
    if(done) cls+=' done';
    div.className=cls;
    const icon = s.type==='checkpoint' ? '⚑' : s.type==='final' ? '★' : (done?'✓':(i+1));
    div.innerHTML=`<span class="ic">${icon}</span><span>${s.navtitle||s.title}</span>`;
    div.onclick=()=>{ state.current=i; save(); render(); if(window.innerWidth<=860) document.getElementById('sidebar').classList.remove('open'); };
    // en-tête de niveau avant le 1er élément d'un bloc
    if(blockStart.hasOwnProperty(i)){
      const h=document.createElement('div'); h.className='navgroup'; h.textContent=blockStart[i];
      nav.appendChild(h);
    }
    nav.appendChild(div);
  });
  const li=levelInfo();
  document.getElementById('lvlName').textContent='Niveau : '+li.name;
  document.getElementById('lvlPct').textContent=li.pct+'%';
  document.getElementById('lvlBar').style.width=li.pct+'%';
}
function sectionDone(i){
  const s=COURSE[i]; const qs=(s.quiz||s.exam||[]);
  if(!qs.length) return false;
  const r=state.results[i]||{};
  return Object.keys(r).length>=qs.length;
}

/* --- Rendu principal --- */
function render(){
  renderNav();
  const s=COURSE[state.current];
  const a=anchorFor(state.current);
  if(location.hash.replace(/^#/,'')!==a){ suppressHash=true; location.hash=a; }
  const c=document.getElementById('content');
  window.scrollTo(0,0);
  if(s.type==='final'){ renderFinal(s); return; }
  let html='';
  html+=`<div class="kicker">${s.kicker||(s.type==='checkpoint'?'Checkpoint':'Module '+(sectionNumber(state.current)))}</div>`;
  html+=`<h2 class="title">${s.title}</h2>`;
  if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
  if(s.lesson){ html+=`<div class="card lesson">${s.lesson}</div>`; }
  if(s.culture){ html+=`<div class="culture">${s.culture}</div>`; }
  c.innerHTML=html;
  const qs=(s.quiz||s.exam||[]);
  if(qs.length){
    const holder=document.createElement('div'); holder.id='quizHolder'; c.appendChild(holder);
    startQuiz(state.current);
  }
  // navigation module suivant
  const navFoot=document.createElement('div');
  navFoot.style.cssText='display:flex;justify-content:space-between;margin-top:24px';
  navFoot.innerHTML=`
    <button class="btn" ${state.current===0?'disabled':''} id="prevSec">← Précédent</button>
    <button class="btn primary" ${state.current===COURSE.length-1?'disabled':''} id="nextSec">Section suivante →</button>`;
  c.appendChild(navFoot);
  const pv=document.getElementById('prevSec'), nx=document.getElementById('nextSec');
  if(pv) pv.onclick=()=>{state.current--;save();render();};
  if(nx) nx.onclick=()=>{state.current++;save();render();};
}
function sectionNumber(idx){
  let n=0; for(let i=0;i<=idx;i++){ if(COURSE[i].type==='module') n++; } return n;
}

/* --- Moteur de quiz : une question à la fois --- */
function startQuiz(si){
  const s=COURSE[si];
  const qs=(s.quiz||s.exam||[]);
  if(!state.current_q) state.current_q={};
  // reprendre là où on s'est arrêté
  let idx = state.current_q[si] ?? 0;
  const answered = state.results[si]||{};
  // aller à la première non répondue si en cours
  if(idx>=qs.length) idx=qs.length-1;
  renderQuestion(si, idx);
}

function renderQuestion(si, idx){
  state.current_q[si]=idx; save();
  const s=COURSE[si]; const qs=(s.quiz||s.exam||[]);
  const q=qs[idx];
  const holder=document.getElementById('quizHolder');
  const results=state.results[si]||{};
  const isExam = s.type==='checkpoint'||s.type==='final';

  // barre de progression du quiz
  let dots='';
  qs.forEach((_,i)=>{
    let d='dot';
    if(results[i]==='ok')d+=' ok'; else if(results[i]==='bad')d+=' bad'; else if(results[i]==='part')d+=' part';
    if(i===idx)d+=' cur';
    dots+=`<span class="${d}" title="Q${i+1}"></span>`;
  });

  const dlabel={1:'Facile',2:'Moyen',3:'Difficile'}[q.difficulty||1];
  let html=`<div class="card">
    <div class="quizhead">
      <div class="kicker">${isExam?'Examen':'Quiz'} — Question ${idx+1}/${qs.length}</div>
      <span class="pill d${q.difficulty||1}">${dlabel}</span>
    </div>
    <div class="qprompt">${q.prompt}</div>`;
  if(q.code) html+=code(q.code);

  // corps selon type
  if(q.kind==='mcq'||q.kind==='multi'){
    html+=`<div class="choices" id="choices">`;
    q.choices.forEach((ch,i)=>{
      html+=`<div class="choice ${q.kind==='multi'?'multi':''}" data-i="${i}">
        <span class="mk">${q.kind==='multi'?'':''}</span><div>${ch}</div></div>`;
    });
    html+=`</div>`;
  } else if(q.kind==='tf'){
    html+=`<div class="choices" id="choices">
      <div class="choice" data-i="1"><span class="mk"></span><div>Vrai</div></div>
      <div class="choice" data-i="0"><span class="mk"></span><div>Faux</div></div></div>`;
  } else if(q.kind==='predict'){
    html+=`<input class="answer" id="freeAns" placeholder="Écris la sortie attendue (ou 'erreur de compilation')..." autocomplete="off"/>`;
  } else if(q.kind==='text'){
    html+=`<textarea class="answer" id="freeAns" placeholder="Écris ta réponse ici..."></textarea>`;
  } else if(q.kind==='code'){
    html+=`<textarea class="answer" id="freeAns" placeholder="Écris ton code Rust ici...">${q.starter||''}</textarea>`;
  }

  html+=`<div class="hintbox" id="hintbox">💡 Indice : ${q.hint||'Relis la partie du cours correspondante.'}</div>`;
  html+=`<div class="qfoot">
      <div class="progressline">${dots}</div>
      <div style="display:flex;gap:8px">
        ${q.hint?`<button class="btn small ghost" id="hintBtn">Indice</button>`:''}
        <button class="btn primary" id="checkBtn">Vérifier ma réponse</button>
      </div>
    </div>`;

  // feedback
  html+=`<div class="feedback" id="feedback"></div>`;
  html+=`</div>`;
  holder.innerHTML=html;

  // interactions
  let selected = q.kind==='multi'? new Set() : null;
  const choiceEls=holder.querySelectorAll('.choice');
  choiceEls.forEach(el=>{
    el.onclick=()=>{
      if(el.classList.contains('locked'))return;
      if(q.kind==='multi'){
        const i=+el.dataset.i;
        if(selected.has(i)){selected.delete(i);el.classList.remove('sel');}
        else{selected.add(i);el.classList.add('sel');}
      }else{
        choiceEls.forEach(e=>e.classList.remove('sel'));
        el.classList.add('sel'); selected=+el.dataset.i;
      }
    };
  });
  const hintBtn=document.getElementById('hintBtn');
  if(hintBtn) hintBtn.onclick=()=>document.getElementById('hintbox').classList.add('show');
  document.getElementById('checkBtn').onclick=()=>checkAnswer(si,idx,q,selected,choiceEls);

  // si déjà répondu, montrer l'état
  if(results[idx]){ /* on laisse rejouable, ne bloque pas */ }
}

function checkAnswer(si,idx,q,selected,choiceEls){
  const fb=document.getElementById('feedback');
  let verdict='ok'; // ok | bad | part
  let auto=true;

  if(q.kind==='mcq'||q.kind==='tf'){
    const ans = q.kind==='tf' ? (q.answer?1:0) : q.answer;
    if(selected===null){ toast('Choisis une réponse.'); return; }
    choiceEls.forEach(el=>{
      const i=+el.dataset.i; el.classList.add('locked');
      if(i===ans) el.classList.add('correct');
      if(i===selected && i!==ans) el.classList.add('wrong');
    });
    verdict = selected===ans ? 'ok':'bad';
  } else if(q.kind==='multi'){
    if(!selected||selected.size===0){ toast('Sélectionne au moins une réponse.'); return; }
    const ans=new Set(q.answer);
    choiceEls.forEach(el=>{
      const i=+el.dataset.i; el.classList.add('locked');
      if(ans.has(i)) el.classList.add('correct');
      if(selected.has(i)&&!ans.has(i)) el.classList.add('wrong');
    });
    const sel=[...selected].sort().join(','), good=[...ans].sort().join(',');
    verdict = sel===good ? 'ok' : ( [...selected].every(x=>ans.has(x)) ? 'part':'bad');
  } else {
    // réponses libres : auto-évaluation par mots-clés + auto-évaluation utilisateur
    auto=false;
    const val=(document.getElementById('freeAns').value||'').trim();
    if(!val){ toast('Écris ta réponse avant de vérifier.'); return; }
    verdict = gradeFree(val,q);
  }

  // rendu feedback
  const vlabel={ok:'✅ Correct',bad:'❌ Incorrect',part:'🟡 Partiellement correct'}[verdict];
  let fbHtml=`<div class="verdict ${verdict}">${vlabel}</div>`;
  if(!auto && q.model){ fbHtml+=`<div style="margin:8px 0"><strong>Réponse / solution attendue :</strong></div>`+ (q.modelCode?code(q.model):`<div>${q.model}</div>`); }
  fbHtml+=`<div style="margin-top:10px"><strong>Explication détaillée :</strong><br>${q.explain}</div>`;

  if(!auto){
    fbHtml+=`<div class="selfassess">
      <span class="lab">Auto-évaluation honnête — as-tu réussi ?</span>
      <button class="btn small" data-v="ok">✅ Oui</button>
      <button class="btn small" data-v="part">🟡 En partie</button>
      <button class="btn small" data-v="bad">❌ Non</button>
    </div>`;
  }
  fbHtml+=`<div class="qfoot" style="margin-top:16px">
      <span style="color:var(--muted);font-size:13px" id="adaptNote"></span>
      <button class="btn primary" id="nextQ">Question suivante →</button>
    </div>`;
  fb.innerHTML=fbHtml; fb.classList.add('show');
  document.getElementById('checkBtn').disabled=true;

  const s=COURSE[si]; const qs=(s.quiz||s.exam||[]);
  const finishThis=(v)=>{
    recordResult(si,idx,v);
    adaptNote(si,idx,v);
    const nextBtn=document.getElementById('nextQ');
    nextBtn.onclick=()=>{
      if(idx+1<qs.length){ renderQuestion(si,idx+1); }
      else { showSectionSummary(si); }
    };
  };

  if(auto){ finishThis(verdict); }
  else{
    // attendre l'auto-évaluation
    fb.querySelectorAll('.selfassess .btn').forEach(b=>{
      b.onclick=()=>{
        fb.querySelectorAll('.selfassess .btn').forEach(x=>x.style.opacity=.4);
        b.style.opacity=1;
        finishThis(b.dataset.v);
      };
    });
    // par défaut, on enregistre l'estimation par mots-clés tant que l'utilisateur n'a pas cliqué
    finishThis(verdict);
  }
}

function gradeFree(val,q){
  const low=val.toLowerCase();
  if(q.kind==='predict' && q.expect){
    const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
    if(norm(val)===norm(q.expect)) return 'ok';
    // tolérance : contient l'essentiel
    if(q.expect && norm(val).includes(norm(q.expect).slice(0,Math.max(3,q.expect.length-2)))) return 'part';
    if(!q.keywords || !q.keywords.length) return 'bad';
  }
  if(q.keywords && q.keywords.length){
    const hits=q.keywords.filter(k=>low.includes(k.toLowerCase())).length;
    const ratio=hits/q.keywords.length;
    if(ratio>=0.7) return 'ok';
    if(ratio>=0.35) return 'part';
    return 'bad';
  }
  return 'part';
}

function recordResult(si,idx,v){
  if(!state.results[si]) state.results[si]={};
  state.results[si][idx]=v; save(); renderNav();
}

/* Difficulté adaptative : message + suggestion */
function adaptNote(si,idx,v){
  const note=document.getElementById('adaptNote'); if(!note)return;
  // regarde les 3 dernières réponses de la section
  const r=state.results[si]||{};
  const recent=[];
  for(let i=Math.max(0,idx-2);i<=idx;i++){ if(r[i]) recent.push(r[i]); }
  const bad=recent.filter(x=>x==='bad').length;
  const ok=recent.filter(x=>x==='ok').length;
  if(bad>=2){ note.innerHTML='🔻 <b>On ralentit.</b> Relis la section ci-dessus avant de continuer — ce concept est important.'; }
  else if(ok>=3){ note.innerHTML='🔺 <b>Excellent enchaînement !</b> Tu peux viser les questions difficiles suivantes sans crainte.'; }
  else if(v==='ok'){ note.innerHTML='👍 Bien joué.'; }
  else if(v==='part'){ note.innerHTML='🟡 Presque — relis l’explication.'; }
  else { note.innerHTML='Reprends le point correspondant dans le cours.'; }
}

/* Résumé de fin de section (module ou checkpoint) */
function showSectionSummary(si){
  const s=COURSE[si]; const qs=(s.quiz||s.exam||[]);
  const r=state.results[si]||{};
  let ok=0,part=0,bad=0;
  qs.forEach((_,i)=>{ if(r[i]==='ok')ok++; else if(r[i]==='part')part++; else if(r[i]==='bad')bad++; });
  const score=ok+part*0.5, pct=Math.round(score/qs.length*100);
  const holder=document.getElementById('quizHolder');

  // lacunes = questions manquées, regroupées par tag
  const weakTags={};
  qs.forEach((qq,i)=>{ if(r[i]==='bad'||r[i]==='part'){ (qq.tags||['divers']).forEach(t=>weakTags[t]=(weakTags[t]||0)+1); } });
  const weakList=Object.entries(weakTags).sort((a,b)=>b[1]-a[1]);

  let msg;
  if(pct>=85) msg="Maîtrise solide 🎯 — tu peux avancer sereinement.";
  else if(pct>=60) msg="Bon niveau 👍 — quelques points à consolider.";
  else msg="À retravailler ⚠️ — révise la section avant de poursuivre.";

  let html=`<div class="card summary">
    <div class="kicker">${s.type==='checkpoint'?'Bilan du checkpoint':'Bilan du module'}</div>
    <h2 class="title" style="font-size:24px">${msg}</h2>
    <div class="statgrid">
      <div class="stat"><div class="n" style="color:var(--ok)">${ok}</div><div class="l">Réussies</div></div>
      <div class="stat"><div class="n" style="color:var(--warn)">${part}</div><div class="l">Partielles</div></div>
      <div class="stat"><div class="n" style="color:var(--bad)">${bad}</div><div class="l">Manquées</div></div>
      <div class="stat"><div class="n">${pct}%</div><div class="l">Score section</div></div>
    </div>`;
  if(weakList.length){
    html+=`<h4 style="color:var(--acc2)">🎯 Révisions ciblées recommandées :</h4>`;
    weakList.forEach(([t,n])=>{ html+=`<div class="weak"><b>${t}</b> — ${n} question(s) à revoir. Relis la partie correspondante puis rejoue le quiz.</div>`; });
  } else {
    html+=`<div class="weak" style="background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.4)">Aucune lacune détectée sur cette section. 🌟</div>`;
  }
  html+=`<div class="qfoot" style="margin-top:18px">
      <button class="btn" id="retryQuiz">↻ Rejouer le quiz</button>
      <button class="btn primary" id="goNext">${si<COURSE.length-1?'Section suivante →':'Terminé'}</button>
    </div></div>`;
  holder.innerHTML=html;
  document.getElementById('retryQuiz').onclick=()=>{ state.current_q[si]=0; save(); renderQuestion(si,0); };
  const gn=document.getElementById('goNext');
  gn.onclick=()=>{ if(si<COURSE.length-1){state.current=si+1;state.current_q[si]=0;save();render();} };
}

/* --- Examen final : bilan global détaillé --- */
function renderFinal(s){
  const c=document.getElementById('content');
  const g=globalScore();
  const li=levelInfo();
  let html=`<div class="kicker">Examen final & évaluation</div>
    <h2 class="title">${s.title}</h2>
    <div class="sub">${s.sub||''}</div>`;
  if(s.lesson) html+=`<div class="card lesson">${s.lesson}</div>`;
  c.innerHTML=html;
  const holder=document.createElement('div'); holder.id='quizHolder'; c.appendChild(holder);
  startQuiz(state.current);

  // bouton pour afficher l'évaluation globale
  const evalCard=document.createElement('div');
  evalCard.className='card summary';
  evalCard.innerHTML=`<div class="kicker">Évaluation globale du parcours</div>
    <h3 style="margin:6px 0">Ton niveau estimé : <span class="badge" style="background:linear-gradient(135deg,var(--acc),#b03400);color:#fff">${li.name}</span></h3>
    <div class="statgrid">
      <div class="stat"><div class="n">${g.pct}%</div><div class="l">Score global</div></div>
      <div class="stat"><div class="n">${Math.round(g.correct)}</div><div class="l">Points obtenus</div></div>
      <div class="stat"><div class="n">${g.answered}</div><div class="l">Questions traitées</div></div>
      <div class="stat"><div class="n">${g.totalQ}</div><div class="l">Total questions</div></div>
    </div>
    <div id="roadmap"></div>`;
  c.appendChild(evalCard);
  renderRoadmap(li);

  const navFoot=document.createElement('div');
  navFoot.style.cssText='display:flex;justify-content:space-between;margin-top:24px';
  navFoot.innerHTML=`<button class="btn" id="prevSec">← Précédent</button><span></span>`;
  c.appendChild(navFoot);
  document.getElementById('prevSec').onclick=()=>{state.current--;save();render();};
}
function renderRoadmap(li){
  const el=document.getElementById('roadmap'); if(!el)return;
  // lacunes globales par tag
  const tagFail={};
  COURSE.forEach((s,si)=>{ const qs=(s.quiz||s.exam||[]); const r=state.results[si]||{};
    qs.forEach((q,i)=>{ if(r[i]==='bad'||r[i]==='part'){ (q.tags||[]).forEach(t=>tagFail[t]=(tagFail[t]||0)+1);} }); });
  const weak=Object.entries(tagFail).sort((a,b)=>b[1]-a[1]).slice(0,6);
  let h=`<h4 style="color:var(--acc2)">🩺 Diagnostic de tes lacunes</h4>`;
  if(weak.length){ h+='<ul>'; weak.forEach(([t,n])=>h+=`<li><b>${t}</b> — ${n} erreur(s). À retravailler en priorité.</li>`); h+='</ul>'; }
  else h+='<p>Aucune lacune majeure détectée — excellent ! 🌟</p>';
  h+=`<h4 style="color:var(--acc2)">🗺️ Feuille de route vers le niveau avancé</h4>
  <ol>
    <li><b>Lifetimes avancés & variance</b> : <code>'static</code>, HRTB (<code>for&lt;'a&gt;</code>), sous-typage des durées de vie.</li>
    <li><b>Traits avancés</b> : types associés, <code>impl Trait</code>, objets-traits <code>dyn</code>, generic vs dynamic dispatch, <code>From/Into</code>, <code>Deref</code>.</li>
    <li><b>Concurrence sûre</b> : <code>Arc&lt;Mutex&lt;T&gt;&gt;</code>, <code>Send</code>/<code>Sync</code>, <code>async/await</code> avec Tokio.</li>
    <li><b>Gestion d’erreurs pro</b> : <code>thiserror</code>, <code>anyhow</code>, erreurs personnalisées, <code>?</code> avec conversion <code>From</code>.</li>
    <li><b>Unsafe & FFI</b> : quand et comment, invariants, <code>MaybeUninit</code>, interfaçage C.</li>
    <li><b>Écosystème</b> : <code>serde</code>, <code>clap</code>, <code>rayon</code>, tests d’intégration, benchmarks (<code>criterion</code>).</li>
    <li><b>Projet réel</b> : construis un CLI ou un petit serveur web (axum) de bout en bout.</li>
    <li>Lis <i>The Rust Programming Language</i> (le « Book »), fais <i>Rustlings</i> et <i>Rust by Example</i>.</li>
  </ol>`;
  el.innerHTML=h;
}

/* --- Contrôles UI --- */
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Réinitialiser toute ta progression ?')){ state=fresh(); save(); render(); toast('Progression réinitialisée.'); }
};
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');

/* --- Démarrage : on attend que le contenu soit chargé --- */
window.addEventListener('hashchange', function(){
  if(suppressHash){ suppressHash=false; return; }
  const idx=indexForAnchor(location.hash);
  if(idx!=null && idx!==state.current){ state.current=idx; save(); render(); }
});
function boot(){
  if(COURSE.length===0){ setTimeout(boot,30); return; }
  const idx=indexForAnchor(location.hash);
  if(idx!=null) state.current=idx;
  if(state.current>=COURSE.length) state.current=0;
  render();
}
boot();
</script>
<script src="../../assets/nav.js"></script>
</body>
</html>
